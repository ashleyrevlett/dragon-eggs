<!doctype html>
<meta charset="utf-8">
<title>Dig for Dragon Eggs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: landscape-first like Roblox mobile. Menu column left, mine shaft centre, nests right.
   Portrait collapses to HUD / mine / nests row / menu row. Single dark game look by choice. */
:root {
  --night: #160f24;
  --panel: #231a3d;
  --panel-2: #2f2452;
  --line: #4a3d80;
  --fg: #fff8ec;
  --muted: #b9add6;
  --gold: #ffc93c;
  --gem: #62e3ff;
  --go: #5fd35f;
  --go-dark: #2f9b3a;
  --warn: #ff6b6b;
  --pink: #ff8fc7;
  --shadow: rgba(8, 4, 16, .55);
  --font: "Fredoka", "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--fg); font-family: var(--font); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
/* Touch: 44px minimum targets everywhere; no double-tap zoom delay on controls. */
button, [data-a] { touch-action: manipulation; }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }

#app { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: grid; grid-template-columns: 84px minmax(0, 1fr) 104px; grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "hud hud hud" "nav mine nests"; }

/* HUD */
#hud { grid-area: hud; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: linear-gradient(var(--panel), var(--night)); border-bottom: 2px solid var(--line); z-index: 5; min-width: 0; }
.cur { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 4px; font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 0; }
.coin, .gemi { width: 22px; height: 22px; flex: none; display: inline-block; }
.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, var(--gold) 45%, #d8941a 100%); box-shadow: inset 0 -2px 0 #b37512; }
.gemi { background: linear-gradient(135deg, #d6fbff, var(--gem) 50%, #2b9fc4); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
#depth { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; }
#depth .top { display: flex; gap: 8px; align-items: baseline; font-weight: 600; white-space: nowrap; overflow: hidden; max-width: 100%; }
#depth .m { font-size: 20px; font-variant-numeric: tabular-nums; }
#depth .ln { font-size: 13px; color: var(--muted); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; }
#depth .bar { width: min(260px, 90%); height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
#depth .bar i { display: block; height: 100%; background: var(--layer-accent, var(--go)); width: 0; transition: width .3s; }
#event { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); border: 2px solid var(--line); white-space: nowrap; }
#event.on { background: #5a3a00; border-color: var(--gold); color: #ffe7a3; animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 14px rgba(255, 201, 60, .6); } }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; background: var(--panel-2); border: 2px solid var(--line); font-size: 16px; font-weight: 700; cursor: pointer; flex: none; display: grid; place-items: center; padding: 0; }

/* Left menu */
#nav { grid-area: nav; display: flex; flex-direction: column; gap: 10px; padding: 12px 8px; align-items: center; z-index: 4; }
.navb { width: 68px; min-height: 64px; border-radius: 16px; border: 3px solid rgba(0,0,0,.35); border-bottom-width: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 12px; letter-spacing: .02em; padding: 6px 2px; position: relative; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.navb canvas { width: 34px; height: 34px; }
.navb:active { transform: translateY(2px); border-bottom-width: 4px; }
.navb[data-open="dragons"] { background: #e2558f; }
.navb[data-open="shop"] { background: #3aa65a; }
.navb[data-open="rebirth"] { background: #7a5cff; }
#autoBtn { background: #5d4a8a; }
#autoBtn.on { background: #ffb02e; color: #3a2200; text-shadow: none; }
#surfaceBtn { background: #2f9fd0; }
#surfaceBtn b { font-size: 20px; line-height: 1; }
.navb .dot { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--warn); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--night); }
.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 6px rgba(255, 255, 255, .25); } }

/* Mine */
#mineWrap { grid-area: mine; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#mine { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
#hint { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(92%, 520px); background: rgba(22, 15, 36, .88); border: 2px solid var(--line); border-radius: 14px; padding: 6px 12px; font-weight: 500; font-size: 15px; line-height: 1.3; text-align: center; pointer-events: none; }
#hint b { color: var(--gold); font-weight: 600; }
#hint .need { display: flex; gap: 4px 6px; flex-wrap: wrap; justify-content: center; margin-top: 4px; font-size: 13px; }
#hint .need span { padding: 1px 8px; border-radius: 999px; background: var(--panel-2); }
#hint .need span.ok { background: #1f5a2b; color: #c8ffd0; }
#banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
#banner.show { opacity: 1; }
#banner .t { font-size: clamp(26px, 5vw, 44px); font-weight: 700; text-shadow: 0 4px 0 rgba(0,0,0,.45); color: var(--layer-accent, #fff); white-space: nowrap; }
#banner .s { font-size: 15px; color: var(--fg); text-shadow: 0 2px 0 rgba(0,0,0,.6); }
#toasts { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 6px; align-items: center; pointer-events: none; width: 92%; }
.toast { background: rgba(22, 15, 36, .92); border: 2px solid var(--line); border-radius: 12px; padding: 6px 14px; font-weight: 500; font-size: 14px; animation: toastIn .25s ease-out; text-align: center; }
.toast.good { border-color: var(--go); } .toast.gold { border-color: var(--gold); } .toast.bad { border-color: var(--warn); }
@keyframes toastIn { from { transform: translateY(10px); opacity: 0; } }

/* Nests */
#nests { grid-area: nests; display: flex; flex-direction: column; gap: 8px; padding: 10px 8px; align-items: center; overflow-y: auto; z-index: 4; }
#nests h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nest { width: 84px; height: 84px; border-radius: 18px; border: 3px solid var(--line); background: radial-gradient(circle at 50% 70%, #5a3a24 0 34%, var(--panel-2) 36%); position: relative; cursor: pointer; padding: 0; flex: none; }
.nest canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.nest .t { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.nest .ring { position: absolute; inset: -3px; border-radius: 18px; pointer-events: none; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
.nest.ready { border-color: var(--gold); animation: pulse 0.9s ease-in-out infinite; }
.nest.ready .t { color: var(--gold); }
.nest.locked { background: var(--panel); border-style: dashed; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); gap: 2px; }
.nest.locked .plus { font-size: 26px; line-height: 1; color: var(--fg); }
#basket { font-size: 12px; color: var(--muted); text-align: center; font-weight: 500; }

/* Sheet */
#sheet { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h, 56px)); right: 0; bottom: 0; width: min(460px, 62vw); background: var(--panel); border-left: 3px solid var(--line); box-shadow: -10px 0 30px var(--shadow); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .22s ease-out; }
#sheet.open { transform: none; }
#sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
#sheet header h2 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
#sheetBody { overflow-y: auto; padding: 4px 14px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; touch-action: pan-y; }
.sec h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec .sub { font-size: 13px; color: var(--muted); margin: -2px 0 8px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.row + .row { margin-top: 6px; }
.row .grow { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; font-size: 15px; }
.row .ds { font-size: 12px; color: var(--muted); }
.btn { border: 0; border-radius: 12px; min-height: 44px; padding: 8px 14px; font-weight: 700; font-size: 15px; justify-content: center; cursor: pointer; background: var(--go); color: #0f2a12; box-shadow: inset 0 -4px 0 var(--go-dark); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { background: #4b4466; color: #9b92b8; box-shadow: inset 0 -4px 0 #3a3452; cursor: default; }
.btn.alt { background: #ffcf4a; color: #3d2a00; box-shadow: inset 0 -4px 0 #c99415; }
.btn.danger { background: var(--warn); color: #3a0909; box-shadow: inset 0 -4px 0 #b83c3c; }
.btn.robux { background: #e8e8f0; color: #1d1d2b; box-shadow: inset 0 -4px 0 #a8a8bc; }
.btn .coin, .btn .gemi { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #3c3166; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.chip.ok { background: #1f5a2b; color: #c8ffd0; } .chip.no { background: #5a1f2b; color: #ffd0d6; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.lv { font-size: 12px; font-weight: 600; color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.dcard { background: var(--panel-2); border-radius: 14px; border: 3px solid transparent; padding: 6px 4px 8px; text-align: center; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.dcard canvas { width: 64px; height: 64px; }
.dcard .nm { font-weight: 600; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcard .pw { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dcard .rar { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.dcard.eq { border-color: var(--go); }
.dcard.eq::after { content: "EQUIPPED"; position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; background: var(--go); color: #0f2a12; border-radius: 6px; padding: 1px 4px; }
.dcard.sel { outline: 3px solid var(--gold); }
.dactions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.dactions { flex-direction: column; align-self: stretch; }
.dactions .btn { font-size: 14px; padding: 8px 10px; }
.dex { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.dex canvas { width: 100%; aspect-ratio: 1; max-width: 100%; background: var(--panel-2); border-radius: 10px; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lists ul { margin: 0; padding: 8px 10px 8px 26px; background: var(--panel-2); border-radius: 12px; font-size: 13px; line-height: 1.5; }
.bigbar { height: 14px; border-radius: 8px; background: var(--panel-2); overflow: hidden; }
.bigbar i { display: block; height: 100%; background: linear-gradient(90deg, #7a5cff, #c77dff); }
.note { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; min-height: 40px; min-width: 44px; padding: 5px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--line); }

/* Modals */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(10, 6, 20, .72); display: grid; place-items: center; padding: 16px; }
.card { background: var(--panel); border: 3px solid var(--line); border-radius: 22px; padding: 16px; width: min(380px, 100%); text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; box-shadow: 0 20px 40px var(--shadow); max-height: 100%; overflow: auto; }
#revealCanvas { width: min(240px, 60vw, 42vh); height: min(240px, 60vw, 42vh); }
#revealInfo .rar { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }
#revealInfo .nm { font-size: 28px; font-weight: 700; line-height: 1.1; }
#revealInfo .pw { color: var(--muted); font-size: 14px; }
.card .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.card h3 { margin: 0; font-size: 20px; }

/* Portrait */
@media (max-aspect-ratio: 1/1) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "hud" "mine" "nests" "nav"; }
  #nav { flex-direction: row; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 2px solid var(--line); }
  .navb { min-height: 56px; width: 74px; }
  #nests { flex-direction: row; justify-content: center; padding: 6px 8px; overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; }
  #nests h3 { display: none; }
  .nest { width: 64px; height: 64px; border-radius: 14px; }
  #basket { max-width: 64px; }
  #sheet { top: auto; left: 0; width: auto; height: 74%; border-left: 0; border-top: 3px solid var(--line); border-radius: 22px 22px 0 0; transform: translateY(105%); }
  #hud { gap: 6px; padding: 6px 8px; }
  .cur { font-size: 15px; padding-right: 9px; }
  #event { display: none; }
}
/* Short screens (phones in landscape): give the shaft every pixel of height. */
@media (max-height: 480px) {
  #hud { padding: 4px 10px; gap: 8px; }
  .cur { font-size: 15px; }
  #depth .m { font-size: 17px; }
  #hint { font-size: 13px; padding: 4px 10px; top: 6px; }
  #hint .need { font-size: 12px; margin-top: 2px; }
  #nav { gap: 8px; padding: 8px 6px; }
  .navb { min-height: 58px; }
  .nest { width: 78px; height: 78px; }
}
@media (prefers-reduced-motion: reduce) { .pulse, .nest.ready, #event.on { animation: none; } }
</style>

<div id="app">
  <div id="hud">
    <div class="cur" title="Gold"><span class="coin"></span><span id="gold">0</span></div>
    <div class="cur" title="Gems"><span class="gemi"></span><span id="gems">0</span></div>
    <div id="depth"><div class="top"><span class="m" id="depthM">0 m</span><span class="ln" id="layerName">Meadow Topsoil</span></div><div class="bar"><i id="layerBar"></i></div></div>
    <div id="event">Next event 2:30</div>
    <button class="icon-btn" id="soundBtn" aria-label="Sound on or off">♪</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
  </div>
  <nav id="nav">
    <button class="navb" data-open="dragons" id="navDragons"><canvas width="68" height="68" id="navDragonIcon"></canvas>Dragons<span class="dot" id="dragonDot" hidden></span></button>
    <button class="navb" data-open="shop" id="navShop"><canvas width="68" height="68" id="navShopIcon"></canvas>Shop<span class="dot" id="shopDot" hidden></span></button>
    <button class="navb" data-open="rebirth" id="navRebirth"><canvas width="68" height="68" id="navRebirthIcon"></canvas>Rebirth<span class="dot" id="rebirthDot" hidden></span></button>
    <button class="navb" id="autoBtn" hidden>AUTO<br>DIG</button>
    <button class="navb" id="surfaceBtn" hidden><b>▲</b>Surface</button>
  </nav>
  <div id="mineWrap">
    <canvas id="mine"></canvas>
    <div id="hint"></div>
    <div id="banner"><div class="t" id="bannerT"></div><div class="s" id="bannerS"></div></div>
    <div id="toasts"></div>
  </div>
  <aside id="nests"><h3>Nests</h3><div id="nestList" style="display:contents"></div><div id="basket"></div></aside>
</div>

<section id="sheet" aria-label="Menu">
  <header><h2 id="sheetTitle">Shop</h2><button class="icon-btn" id="sheetClose" aria-label="Close">✕</button></header>
  <div id="sheetBody"></div>
</section>

<div class="modal" id="reveal" hidden>
  <div class="card">
    <canvas id="revealCanvas" width="480" height="480"></canvas>
    <div id="revealInfo"></div>
    <div class="acts" id="revealActs"></div>
  </div>
</div>

<div class="modal" id="skip" hidden>
  <div class="card" id="skipCard"></div>
</div>

<script src="config.js"></script>
<script src="game.js"></script>
